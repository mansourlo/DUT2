<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice2-Q2</title>
</head>
<body>
    <h1>Table de multiplication</h1>
    <script>
        let num = prompt("Entrez un nombre");

        if(isNaN(num) || num===""){
            alert("Erreur!");
        }else{
            for(let i=0; i<=10; i++){
                document.write(`<p>${i} x ${num} = ${i * num}<p>`);
            }
        }
    </script>
</body>
</html>
