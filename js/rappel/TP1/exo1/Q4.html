<body>
    <script>
        let answer = confirm("Est-ce que la couleur de fond actuelle vous plait?");

        if(answer){
            alert("Aucun changement effectué");
        }else{
            document.body.style.backgroundColor = "skyblue"
            alert("Changement effectue avec succes!");
        }
    </script>
</body>
